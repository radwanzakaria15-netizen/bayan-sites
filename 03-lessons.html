<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدروس والمحاضرات</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#f4f7f8;--surface:#fff;--ink:#1e2935;--muted:#66737f;--line:#e8edf0;--primary:#287c78;--primary-dark:#1e6562;--soft:#e8f3f1;--gold:#c18c42;--soft-gold:#fbf4e9;--blue:#587eaa;--soft-blue:#edf3f9}
@media(prefers-color-scheme:dark){:root{--bg:#0e1519;--surface:#16212a;--ink:#e8eef2;--muted:#93a0a9;--line:#263540;--primary:#4fb3ad;--primary-dark:#3a918c;--soft:#173331;--gold:#e0b06a;--soft-gold:#2b2518;--blue:#8fb0d6;--soft-blue:#1a2633}}
*{box-sizing:border-box}html{direction:rtl}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;line-height:1.7;padding:14px}
h1,h2,h3{margin:0;font-weight:800}.wrap{max-width:980px;margin:0 auto}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.head small{color:var(--muted);display:block;font-size:13px}.head h1{font-size:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 1px 2px rgba(20,40,50,.04)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;outline:none}
input:focus,select:focus{border-color:var(--primary)}
.bar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:14px}@media(max-width:620px){.bar{grid-template-columns:1fr}}
.chip{display:inline-block;background:var(--soft);color:var(--primary-dark);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700}
.chip.gold{background:var(--soft-gold);color:var(--gold)}.chip.blue{background:var(--soft-blue);color:var(--blue)}
details{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
summary{cursor:pointer;list-style:none;padding:12px 16px;font-weight:700;display:flex;align-items:center;gap:10px}summary::-webkit-details-marker{display:none}
summary::after{content:"⌄";margin-inline-start:auto;color:var(--primary);transition:.2s}details[open]>summary::after{transform:rotate(180deg)}
details .in{padding:2px 16px 14px}details details{background:var(--bg);border-radius:12px}
.sym{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--primary-dark);display:grid;place-items:center;font-weight:800;flex:none}
ul{margin:6px 0 0;padding-inline-start:20px;color:var(--muted)}li{margin:2px 0}
a.btn{display:inline-block;background:var(--primary);color:#fff;text-decoration:none;border-radius:12px;padding:5px 14px;font-weight:700;font-size:14px}
a.btn.ghost{background:var(--soft);color:var(--primary-dark)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px dashed var(--line)}.row:first-child{border-top:0}
.row b{flex:1;min-width:150px;word-break:break-word}.muted{color:var(--muted);font-size:13.5px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:14px;padding:9px;cursor:pointer}.tabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.empty{text-align:center;color:var(--muted);padding:26px}.pin{border-color:var(--gold)}
.hero{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:0;border-radius:22px;padding:24px 20px;margin-bottom:14px}.hero h2{font-size:26px}.hero p{margin:6px 0 0;opacity:.9}
.stat{text-align:center}.stat b{display:block;font-size:30px;color:var(--primary)}.stat span{color:var(--muted);font-weight:700}
</style></head><body><div class="wrap"><div class="head"><div class="mark">ب</div><div><small>الملفات المنشورة لكل مجموعة</small><h1>الدروس والمحاضرات</h1></div></div><div class="tabs" id="tabs"></div><div id="list"></div></div><script>/* ضع هنا عنوان موقعك القديم (لفتح الملفات منه) مثل: https://اسم-موقعك.workers.dev  — أو اتركه فارغًا إن لم تنقل الملفات بعد */
const FILES_BASE="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const DATA={"A": {"علم الاحياء": [{"axis": "مدخل إلى علم الأحياء", "unit": "التنظيم البنيوي للأحياء", "files": [{"n": "مدخل إلى علم الأحياء.pdf", "k": "A-01-01-01/1795465510943-790c25d6__مدخل إلى علم الأحياء.pdf", "s": 1754550, "t": "application/pdf"}, {"n": "مدخل إلى علم الأحياء تابع.pdf", "k": "A-01-01-01/1795465561017-a6ebb5f0__مدخل إلى علم الأحياء تابع.pdf", "s": 455715, "t": "application/pdf"}, {"n": "مدخل إلى علم الأحياء -عرض تقديمي- .pdf", "k": "A-01-01-01/1795465565791-076c5f15__مدخل إلى علم الأحياء -عرض تقديمي- .pdf", "s": 3229896, "t": "application/pdf"}]}, {"axis": "مدخل إلى علم الأحياء", "unit": "تصنيف العالم الحي", "files": [{"n": "تصنيف_الكائنات_الحية.pdf", "k": "A-01-01-02/1795465607738-37cfb61c__تصنيف_الكائنات_الحية.pdf", "s": 1983837, "t": "application/pdf"}, {"n": "تصنيف العالم الحي 2.pdf", "k": "A-01-01-02/1795465607830-db97a031__تصنيف العالم الحي 2.pdf", "s": 2297598, "t": "application/pdf"}]}], "قضايا النقد": [{"axis": "مدخل إلى فلسفة النقد وأدواته", "unit": "وظيفة النقد وغايته", "files": [{"n": "المحاضرة_الأولى_ماهية_النقد_الأدبي.pdf", "k": "A-03-01-01/bbdbedf1-91f4-414f-b8c7-ab2955d2a8e3__المحاضرة_الأولى_ماهية_النقد_الأدبي.pdf", "s": 371158, "t": "application/pdf"}]}, {"axis": "تاريخ النقد العربي القديم (الجذور والتحولات)", "unit": "النقد الفطري (الجاهلي)", "files": [{"n": "محاضرات المحور الثاني.pdf", "k": "A-03-02-01/41bbf8a0-3cc2-49a2-a50a-b2854bf8f082__محاضرات المحور الثاني.pdf", "s": 848160, "t": "application/pdf"}]}, {"axis": "قضايا النقد العربي الكبرى", "unit": "قضية اللفظ والمعنى", "files": [{"n": "محاضرات_المحور_الثالث_قضايا_النقد_العربي_قديما_1.pdf", "k": "A-03-03-01/1795466691385-af96ee21__محاضرات_المحور_الثالث_قضايا_النقد_العربي_قديما_1.pdf", "s": 599274, "t": "application/pdf"}]}], "الرياضيات": [{"axis": "برنامج مقياس الرياضيات", "unit": "التشفير", "files": [{"n": "محاضرات الرياضيات كاملة.pdf", "k": "A-04-01-01/250edcba-5b02-4c0a-80ca-1498e7495564__محاضرات الرياضيات كاملة.pdf", "s": 443070, "t": "application/pdf"}]}], "التربية الإسلامية": [{"axis": "فقه أركان الإسلام والشهادتين", "unit": "فقه أركان الإسلام", "files": [{"n": "فقه اركان الإسلام.pdf", "k": "A-07-01-01/1795218956612-40ed6be6__فقه اركان الإسلام.pdf", "s": 663544, "t": "application/pdf"}]}]}, "B": {"علم الاحياء": [{"axis": "مدخل إلى علم الأحياء", "unit": "التنظيم البنيوي للأحياء", "files": [{"n": "التنظيم البنيوي.pdf", "k": "B-01-01-01/bcd4cc30-2b4a-4752-b5a9-74414bfe9544__التنظيم البنيوي.pdf", "s": 2549703, "t": "application/pdf"}]}], "الصرف العربي": [{"axis": "المصادر وأوزانها", "unit": "المصادر وأوزانها", "files": [{"n": "المحاضرة الثالثة.pdf", "k": "B-02-01-01/11d6a534-ef49-46e2-b95c-bd652e16af16__المحاضرة الثالثة.pdf", "s": 347391, "t": "application/pdf"}, {"n": "المحاضرة الثانية.pdf", "k": "B-02-01-01/d6923fdf-dae4-4db5-96aa-f9d3d8b655cd__المحاضرة الثانية.pdf", "s": 447959, "t": "application/pdf"}, {"n": "المحاضرة_الأولى_في_علم_الصرف.pdf", "k": "B-02-01-01/8cb2b96e-4e9a-4d58-a412-27e02c678faa__المحاضرة_الأولى_في_علم_الصرف.pdf", "s": 393803, "t": "application/pdf"}]}, {"axis": "اسم الفاعل", "unit": "اسم الفاعل", "files": [{"n": "المحاضرة الرابعة.pdf", "k": "B-02-02-01/94199e11-c598-4353-8e5e-3eb707067635__المحاضرة الرابعة.pdf", "s": 408319, "t": "application/pdf"}]}], "قضايا النقد": [{"axis": "مدخل إلى فلسفة النقد وأدواته", "unit": "وظيفة النقد وغايته", "files": [{"n": "محاضرة مدخل إلى النقد .pdf", "k": "B-03-01-01/6a1154c6-f48c-4b22-9da9-fdd21665e97c__محاضرة مدخل إلى النقد .pdf", "s": 670011, "t": "application/pdf"}]}], "الرياضيات": [{"axis": "برنامج مقياس الرياضيات", "unit": "التشفير", "files": [{"n": "محاضرات الرياضيات كاملة.pdf", "k": "B-04-01-01/a785ec96-f344-40e9-9bc7-c5418faca307__محاضرات الرياضيات كاملة.pdf", "s": 443070, "t": "application/pdf"}]}], "علم نفس النمو: الطفل والمراهق": [{"axis": "مفاهيم ونظريات النمو", "unit": "علم النفس النمو: الطفل والمراهق", "files": [{"n": "مدخل الى علم النفس نمو الطفل.pdf", "k": "B-06-01-01/1795466905480-ad83094a__مدخل الى علم النفس نمو الطفل.pdf", "s": 1707024, "t": "application/pdf"}]}, {"axis": "مفاهيم ونظريات النمو", "unit": "النمو ونظرياته", "files": [{"n": "محاضرة النمو ونظرياته.pdf", "k": "B-06-01-02/1795466913587-58d77acc__محاضرة النمو ونظرياته.pdf", "s": 855257, "t": "application/pdf"}]}], "لسانيات عامة": [{"axis": "برنامج اللسانيات العامة", "unit": "اللسانيات: مدخل مفاهيمي", "files": [{"n": "محاضرة لسانيات موجزة.pdf", "k": "B-10-01-01/1795218817972-006dc439__محاضرة لسانيات موجزة.pdf", "s": 505503, "t": "application/pdf"}]}]}};let G=Object.keys(DATA)[0];

const size=n=>n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
function render(){$("tabs").innerHTML=Object.keys(DATA).map(g=>`<button class="${g===G?"on":""}" data-g="${g}">المجموعة ${g}</button>`).join("");
const d=DATA[G]||{};$("list").innerHTML=Object.keys(d).length?Object.keys(d).map(s=>`<details><summary><span class="sym">${esc(s[0])}</span>${esc(s)}<span class="chip">${d[s].reduce((n,u)=>n+u.files.length,0)} ملفات</span></summary><div class="in">${d[s].map(u=>`<div class="muted" style="margin-top:8px">${esc(u.axis)}</div><div class="card" style="padding:4px 14px;margin:4px 0"><div style="font-weight:800;padding-top:8px">${esc(u.unit)}</div>${u.files.map(f=>`<div class="row"><b>${esc(f.n)}</b><span class="muted">${size(f.s)}</span><a class="btn ghost" target="_blank" rel="noopener" href="${FILES_BASE}/api/file?key=${encodeURIComponent(f.k)}">فتح</a><a class="btn" href="${FILES_BASE}/api/file?key=${encodeURIComponent(f.k)}&download=1">تحميل</a></div>`).join("")}</div>`).join("")}</div></details>`).join(""):'<div class="empty">لا توجد ملفات منشورة لهذه المجموعة بعد.</div>';}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-g]");if(b){G=b.dataset.g;render()}});render();</script></body></html>
